[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-telegram"
version = "0.1.0"
description = "Asistente academico personal por Telegram"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68.0",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=21.7,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
jarvis-telegram = "jarvis.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
